name: Bug report
description: A guard, gate or script did something other than what its docs or self-test say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A security problem does not go here. Report it privately: Security → Report a vulnerability.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and the output, pasted as text. Remove any secret first.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The smallest repo state and command that shows it.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Harness commit
      description: The output of `git rev-parse --short HEAD` in your copy of the harness.
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: OS, Node version and coding agent
      placeholder: Windows 11, Node 22.9, Claude Code
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: The output of `node bin/harness.js doctor`, if it runs.
      render: text
